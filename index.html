<script>
function toggle(layerKey){
  const row = document.querySelector(`.legend-row[data-layer="${layerKey}"]`);
  const isOn = !row.classList.contains('off');
  row.classList.toggle('off', isOn);
  if(layerKey === 'libraries' || layerKey === 'poi'){
    applyViewBox(); // re-derives layer-libraries/layer-poi + names visibility from row state + zoom
  } else {
    const g = document.getElementById('layer-' + layerKey);
    g.style.display = isOn ? 'none' : '';
  }
  updateAllState();
}
function updateAllState(){
  const rows = document.querySelectorAll('.legend-row');
  const allOn = Array.from(rows).every(r => !r.classList.contains('off'));
  document.getElementById('legend-all').classList.toggle('off', !allOn);
}
document.querySelectorAll('.legend-row').forEach(row=>{
  row.classList.add('off');
  row.addEventListener('click', ()=> toggle(row.dataset.layer));
});
document.getElementById('legend-all').addEventListener('click', ()=>{
  const allBtn = document.getElementById('legend-all');
  const turnOn = allBtn.classList.contains('off');
  ['faculty','libraries','poi','eastwest','axes','parking'].forEach(key=>{
    const row = document.querySelector(`.legend-row[data-layer="${key}"]`);
    row.classList.toggle('off', !turnOn);
    if(key !== 'libraries' && key !== 'poi'){
      const g = document.getElementById('layer-' + key);
      g.style.display = turnOn ? '' : 'none';
    }
  });
  allBtn.classList.toggle('off', !turnOn);
  applyViewBox();
});
updateAllState();

// ===== Zoom & Pan + zoom-dependent building names =====
const mapsvg = document.getElementById('mainmap');
const buildingNames = document.getElementById('building-names');
const BASE_VB = {x:0, y:0, w:1400, h:1424};
let vb = {...BASE_VB};
const MIN_W = 120;      // most zoomed-in
const MAX_W = 1400;     // most zoomed-out (= original)
const NAMES_THRESHOLD = 500; // viewBox width below this => "zoomed in enough" => show building names

function applyViewBox(){
  mapsvg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const zoomedIn = vb.w < NAMES_THRESHOLD;
  buildingNames.style.display = zoomedIn ? '' : 'none';
  const libLayer = document.getElementById('layer-libraries');
  const libNames = document.getElementById('library-names');
  const libOn = !document.querySelector('.legend-row[data-layer="libraries"]').classList.contains('off');
  libLayer.style.display = (libOn && !zoomedIn) ? '' : 'none';
  libNames.style.display = (libOn && zoomedIn) ? '' : 'none';

  const poiLayer = document.getElementById('layer-poi');
  const poiNames = document.getElementById('poi-names');
  const poiOn = !document.querySelector('.legend-row[data-layer="poi"]').classList.contains('off');
  poiLayer.style.display = (poiOn && !zoomedIn) ? '' : 'none';
  poiNames.style.display = (poiOn && zoomedIn) ? '' : 'none';

  const facLabels = document.getElementById('faculty-labels');
  if(facLabels) facLabels.style.display = zoomedIn ? 'none' : '';
}

function svgPoint(clientX, clientY){
  const rect = mapsvg.getBoundingClientRect();
  const relX = (clientX - rect.left) / rect.width;
  const relY = (clientY - rect.top) / rect.height;
  return { x: vb.x + relX*vb.w, y: vb.y + relY*vb.h, relX, relY };
}

function zoomAt(clientX, clientY, factor){
  const p = svgPoint(clientX, clientY);
  let newW = vb.w * factor;
  newW = Math.max(MIN_W, Math.min(MAX_W, newW));
  const newH = newW * (BASE_VB.h/BASE_VB.w);
  vb.x = p.x - p.relX*newW;
  vb.y = p.y - p.relY*newH;
  vb.w = newW; vb.h = newH;
  applyViewBox();
}

mapsvg.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const factor = e.deltaY < 0 ? 0.88 : 1/0.88;
  zoomAt(e.clientX, e.clientY, factor);
}, {passive:false});

let panning = false, panStart = null;
mapsvg.addEventListener('pointerdown',(e)=>{
  if(e.target.closest('#legend')) return;
  panning = true;
  mapsvg.classList.add('panning');
  panStart = { clientX:e.clientX, clientY:e.clientY, vbx:vb.x, vby:vb.y };
  mapsvg.setPointerCapture(e.pointerId);
});
mapsvg.addEventListener('pointermove',(e)=>{
  if(!panning) return;
  const rect = mapsvg.getBoundingClientRect();
  const dx = (e.clientX - panStart.clientX) / rect.width * vb.w;
  const dy = (e.clientY - panStart.clientY) / rect.height * vb.h;
  vb.x = panStart.vbx - dx;
  vb.y = panStart.vby - dy;
  applyViewBox();
});
mapsvg.addEventListener('pointerup',()=>{ panning=false; mapsvg.classList.remove('panning'); });
mapsvg.addEventListener('pointercancel',()=>{ panning=false; mapsvg.classList.remove('panning'); });

let pinchStartDist = null, pinchStartVB = null;
mapsvg.addEventListener('touchstart',(e)=>{
  if(e.touches.length === 2){
    panning = false;
    const [t1,t2] = e.touches;
    pinchStartDist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    pinchStartVB = {...vb};
  }
}, {passive:true});
mapsvg.addEventListener('touchmove',(e)=>{
  if(e.touches.length === 2 && pinchStartDist){
    e.preventDefault();
    const [t1,t2] = e.touches;
    const dist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    const factor = pinchStartDist / dist;
    const midX = (t1.clientX+t2.clientX)/2, midY = (t1.clientY+t2.clientY)/2;
    vb = {...pinchStartVB};
    zoomAt(midX, midY, factor);
  }
}, {passive:false});
mapsvg.addEventListener('touchend',(e)=>{
  if(e.touches.length < 2){ pinchStartDist = null; }
});

mapsvg.addEventListener('dblclick',(e)=>{
  if(e.target.closest('#legend')) return;
  vb = {...BASE_VB};
  applyViewBox();
});

applyViewBox();
</script>
</body>
