<g id="markers-root"></g>
</svg>
</div>
<div id="panel">
  <h2>בדיקת קואורדינטות על התצלום</h2>
  <div class="hint">אותו אזור שכבר עבדת בו (רקנאטי/גילמן/מוסיקה/ננו טכנולוגיה). לחצי על אותן 2 נקודות שסימנת במפה שלי (למשל פינת בניין ספרייה מרכזית) — יופיע X,Y למעלה + סימון צהוב ממוספר.</div>
  <div id="ptList"></div>
  <button id="clearBtn">נקה את כל הסימונים</button>
</div>
<script>
const svg = document.getElementById("mapsvg");
let points = [];
let panActive = false;

svg.addEventListener("click",(e)=>{
  if(panActive) return;
  const ctm = svg.getScreenCTM();
  if(!ctm) return;
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const loc = pt.matrixTransform(ctm.inverse());
  const x = Math.round(loc.x), y = Math.round(loc.y);
  document.getElementById("coordDisplay").textContent = `X: ${x} , Y: ${y}`;
  points.push({x,y});
  renderMarkers();
});

function renderMarkers(){
  const root = document.getElementById("markers-root");
  root.innerHTML = "";
  points.forEach((p,i)=>{
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("class","marker");
    c.setAttribute("cx",p.x); c.setAttribute("cy",p.y); c.setAttribute("r",5);
    root.appendChild(c);
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("class","marker-label");
    t.setAttribute("x",p.x+9); t.setAttribute("y",p.y-7);
    t.textContent = (i+1);
    root.appendChild(t);
  });
  const list = document.getElementById("ptList");
  list.innerHTML = "";
  points.forEach((p,i)=>{
    const div = document.createElement("div");
    div.className = "ptrow";
    div.innerHTML = `<span>#${i+1}</span><span>x=${p.x}, y=${p.y}</span>`;
    list.appendChild(div);
  });
}

document.getElementById("clearBtn").addEventListener("click",()=>{
  points = [];
  renderMarkers();
  document.getElementById("coordDisplay").textContent = "X: --- , Y: ---";
});

const BASE_VB = {x:0, y:0, w:1400, h:1310};
let vb = {...BASE_VB};
const MIN_W = 40, MAX_W = IMG_W;
function applyViewBox(){ svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function svgPoint(clientX, clientY){
  const rect = svg.getBoundingClientRect();
  const relX = (clientX - rect.left) / rect.width;
  const relY = (clientY - rect.top) / rect.height;
  return { x: vb.x + relX*vb.w, y: vb.y + relY*vb.h, relX, relY };
}
function zoomAt(clientX, clientY, factor){
  const p = svgPoint(clientX, clientY);
  let newW = Math.max(MIN_W, Math.min(MAX_W, vb.w * factor));
  const newH = newW * (BASE_VB.h/BASE_VB.w);
  vb.x = p.x - p.relX*newW;
  vb.y = p.y - p.relY*newH;
  vb.w = newW; vb.h = newH;
  applyViewBox();
}
svg.addEventListener('wheel',(e)=>{
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 0.85 : 1/0.85);
},{passive:false});
let pinchStartDist=null, pinchStartVB=null;
svg.addEventListener('touchstart',(e)=>{
  if(e.touches.length===2){
    const [t1,t2]=e.touches;
    pinchStartDist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    pinchStartVB = {...vb};
  }
},{passive:true});
svg.addEventListener('touchmove',(e)=>{
  if(e.touches.length===2 && pinchStartDist){
    e.preventDefault();
    const [t1,t2]=e.touches;
    const dist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    const factor = pinchStartDist/dist;
    const midX=(t1.clientX+t2.clientX)/2, midY=(t1.clientY+t2.clientY)/2;
    vb = {...pinchStartVB};
    zoomAt(midX, midY, factor);
  }
},{passive:false});
svg.addEventListener('touchend',(e)=>{ if(e.touches.length<2) pinchStartDist=null; });
svg.addEventListener('dblclick',()=>{ vb={...BASE_VB}; applyViewBox(); });

let panPointerInfo = null;
const PAN_THRESHOLD = 5;
svg.addEventListener("pointerdown",(e)=>{
  panPointerInfo = { clientX:e.clientX, clientY:e.clientY, vbx:vb.x, vby:vb.y };
  panActive = false;
});
svg.addEventListener("pointermove",(e)=>{
  if(!panPointerInfo) return;
  const movedX = e.clientX - panPointerInfo.clientX;
  const movedY = e.clientY - panPointerInfo.clientY;
  if(Math.hypot(movedX,movedY) > PAN_THRESHOLD){
    panActive = true;
    const rect = svg.getBoundingClientRect();
    vb.x = panPointerInfo.vbx - movedX/rect.width*vb.w;
    vb.y = panPointerInfo.vby - movedY/rect.height*vb.h;
    applyViewBox();
  }
});
svg.addEventListener("pointerup",()=>{ setTimeout(()=>{panPointerInfo=null; panActive=false;},0); });
svg.addEventListener("pointercancel",()=>{ panPointerInfo=null; panActive=false; });

applyViewBox();
</script>
